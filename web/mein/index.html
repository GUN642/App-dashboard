<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow">
<title>Alle Apps</title>
<meta name="description" content="Private Übersicht.">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@700;900&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body data-mode="private">
<section class="lock" id="lock">
  <form class="lock-card" id="lockForm" autocomplete="on">
    <div class="brand"><span class="reddot"></span><span class="label">Privat</span></div>
    <h1>Alle Apps</h1>
    <p>Die vollständige Liste ist verschlüsselt. Mit deinem Dashboard-Passwort entsperren.</p>
    <input type="text" name="username" value="void-apps" autocomplete="username" hidden>
    <input class="field" id="pw" type="password" placeholder="Passwort" autocomplete="current-password" required>
    <label class="check"><input type="checkbox" id="remember" checked> Auf diesem Gerät merken</label>
    <button class="btn primary" type="submit" style="width:100%">Entsperren</button>
    <div class="err" id="lockErr" role="alert"></div>
  </form>
</section>
<div id="app" class="hidden">
  <header class="head">
    <div class="wrap">
      <div class="head-row">
        <div>
          <div class="brand"><span class="reddot"></span><span class="label">Privat · Alle Apps</span></div>
          <h1 class="title">VOID<span class="accent">.</span>Apps</h1>
          <p class="lead">Alle Apps auf einen Blick. Der Schalter auf jeder Karte legt fest, was auf der öffentlichen Seite erscheint.</p>
        </div>
      </div>
      <div class="stats" id="stats"></div>
    </div>
  </header>
  <div class="toolbar">
    <div class="wrap">
      <label class="search"><span class="label" aria-hidden="true">⌕</span><input id="search" type="search" placeholder="App suchen" aria-label="App suchen"></label>
      <select class="select" id="sort" aria-label="Sortierung"><option value="update">Neueste zuerst</option><option value="name">Name A bis Z</option></select>
      <div class="chips" id="chips"></div>
    </div>
  </div>
  <main class="wrap">
    <div class="grid" id="grid"></div>
    <section class="panel" id="settings"></section>
  </main>
  <footer class="foot">
    <div class="wrap"><span id="generated"></span><span>Nur für dich · nicht verlinkt</span></div>
  </footer>
</div>
<dialog id="detail" aria-label="App-Details"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="../assets/app.js"></script>
</body>
</html>
